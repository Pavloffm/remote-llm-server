version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: remote-llm-server
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - VLLM_API_KEY=${LLM_API_KEY}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command: >
      --model ${MODEL_NAME}
      --host 0.0.0.0
      --port 8000
      --api-key ${LLM_API_KEY}
      --dtype auto
      --max-model-len 4096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf_cache: